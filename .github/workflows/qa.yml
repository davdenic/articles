name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: frontmatter schema, content collection, Astro build errors.
      - name: Build (schema + build gate)
        run: npm run build

      - name: Markdown lint
        run: npm run qa:lint

      - name: Spell check
        run: npm run qa:spell

      - name: Image / asset check
        run: npm run qa:images

      # Internal links resolved against the built site. Blocking.
      # --root-dir lets lychee resolve root-relative links (e.g. "/",
      # "/articles/…") to files under dist.
      - name: Link check (internal)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir "${{ github.workspace }}/dist" dist
          fail: true

      # External links are network-dependent and flaky — report only.
      - name: Link check (external)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --scheme https --scheme http --root-dir "${{ github.workspace }}/dist" dist
          fail: true
