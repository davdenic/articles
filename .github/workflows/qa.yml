name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: frontmatter schema, content collection, Astro build errors.
      - name: Build (schema + build gate)
        run: npm run build

      - name: Markdown lint
        run: npm run qa:lint

      - name: Spell check
        run: npm run qa:spell

      - name: Image / asset check
        run: npm run qa:images

      # The deployed site is served under the base path "/articles", but
      # `dist` has no `articles/` dir (the base is added at serve time).
      # Stage the build under `_linkcheck/articles` so root-relative links
      # like "/articles/<slug>/" resolve to real files for lychee.
      - name: Stage build under base path
        run: |
          rm -rf _linkcheck
          mkdir -p _linkcheck/articles
          cp -R dist/. _linkcheck/articles/

      # Internal links resolved against the staged site. Blocking.
      - name: Link check (internal)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir "${{ github.workspace }}/_linkcheck" _linkcheck/articles
          fail: true

      # External links are network-dependent and flaky — report only.
      - name: Link check (external)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --scheme https --scheme http --root-dir "${{ github.workspace }}/_linkcheck" _linkcheck/articles
          fail: true
