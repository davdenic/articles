<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect x="20" y="30" width="200" height="150" rx="10" fill="#f2c4c4"/><text x="36" y="58" font-size="13" fill="#222">✗ Consumer app</text><text x="36" y="84" font-size="11" fill="#222">• may train on your inputs</text><text x="36" y="106" font-size="11" fill="#222">• longer retention</text><text x="36" y="128" font-size="11" fill="#222">• no DPA</text><rect x="250" y="30" width="200" height="150" rx="10" fill="#c3e6c3"/><text x="266" y="58" font-size="13" fill="#222">✓ API / Enterprise</text><text x="266" y="84" font-size="11" fill="#222">• no training by default</text><text x="266" y="106" font-size="11" fill="#222">• retention off / ZDR</text><text x="266" y="128" font-size="11" fill="#222">• DPA in place</text><text x="235" y="110" font-size="16" text-anchor="middle" fill="#7a7a7a">vs</text></svg>